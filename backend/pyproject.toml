[project]
name = "powerpilot"
version = "0.1.0"
description = "Predictive power and uptime operations for mobile network base stations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
